name: Test Sweeper

# This GitHub action periodically sweeps the tenant for dangling resources.
# Optionally, you can manually run this workflow from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Once a day

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep
    concurrency:
     group: sweep-${{ github.ref }}
     cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            go.dev:443
            lab-1898andco.armis.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
        id: go
      - name: Install Task
        uses: step-security/arduino-setup-task@e7c43b34e57886d0b0f583da4bd8e8ffcb084373 # v2.0.0
        with:
          version: "3.x"
      - run: go mod download
      - name: Sweep Dangling Resources
        env:
          ARMIS_API_URL: ${{ secrets.ARMIS_API_URL }}
          ARMIS_API_KEY: ${{ secrets.ARMIS_API_KEY }}
        run: task sweep
